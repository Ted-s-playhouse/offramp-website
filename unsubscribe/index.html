<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unsubscribe — OffRamp REI</title>
<meta name="robots" content="noindex">
<style>
  :root{--green:#1B4332;--gold:#c88f1c;--paper:#F6F5F1;--ink:#1d2b23;--muted:#5c6f63;--line:#e2e7e2}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);
    background:var(--paper);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  .top{background:var(--green);padding:15px 0}
  .wrap{max-width:520px;margin:0 auto;padding:0 22px;width:100%}
  .top a{color:#fff;text-decoration:none;font-weight:800;font-size:16px}
  .main{flex:1;display:flex;align-items:center;padding:40px 0}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:34px 30px;
    box-shadow:0 10px 30px rgba(20,40,30,.06);width:100%}
  h1{font-size:24px;font-weight:800;color:var(--green);margin-bottom:8px}
  p{font-size:15px;color:#38473f;margin-bottom:16px}
  label{display:block;font-size:12.5px;font-weight:700;color:#37505c;margin-bottom:6px}
  input{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:10px;font-size:15.5px;background:#fbfcfb}
  input:focus{outline:none;border-color:var(--gold);background:#fff}
  button{width:100%;margin-top:16px;padding:14px;background:var(--green);color:#fff;font-weight:800;
    font-size:16px;border:none;border-radius:11px;cursor:pointer}
  button:disabled{opacity:.6}
  .msg{display:none;margin-top:16px;padding:12px 14px;border-radius:10px;font-size:14.5px;font-weight:600}
  .msg.ok{display:block;background:#e8f5ec;color:#1c6b39;border:1px solid #b6e0c4}
  .msg.err{display:block;background:#fdeceb;color:#a3271f;border:1px solid #f2c4bf}
  .foot{text-align:center;font-size:12.5px;color:var(--muted);padding:16px}
  .foot a{color:var(--gold)}
</style>
</head>
<body>
<div class="top"><div class="wrap"><a href="/"><img src="/brand/mark_ramp.png" alt="" style="height:30px;width:30px;border-radius:7px;object-fit:contain;vertical-align:middle;margin-right:9px">OffRamp REI</a></div></div>
<div class="main"><div class="wrap">
  <div class="card">
    <h1>Unsubscribe</h1>
    <p>Enter your email to stop receiving marketing and educational emails from OffRamp REI. You'll still get essential account messages if you have an account.</p>
    <form id="unsubForm" novalidate>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      <button type="submit" id="btn">Unsubscribe me</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>
</div></div>
<div class="foot">Changed your mind? <a href="/">Return to OffRamp REI</a></div>
<script>
  const q = new URLSearchParams(location.search).get('e');
  if (q) document.getElementById('email').value = q;
  const form = document.getElementById('unsubForm');
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'msg';
    const email = document.getElementById('email').value.trim();
    if (!email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
      msg.className = 'msg err'; msg.textContent = 'Please enter a valid email address.'; return;
    }
    btn.disabled = true; btn.textContent = 'Processing…';
    try {
      const r = await fetch('/api/unsubscribe', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({email})
      });
      if (!r.ok) throw new Error();
      msg.className = 'msg ok';
      msg.textContent = "You're unsubscribed. You won't receive further marketing emails from us.";
      form.reset();
    } catch (err) {
      msg.className = 'msg err';
      msg.textContent = "Something went wrong. Email hello@offramprei.com and we'll remove you right away.";
    } finally {
      btn.disabled = false; btn.textContent = 'Unsubscribe me';
    }
  });
</script>
</body>
</html>
