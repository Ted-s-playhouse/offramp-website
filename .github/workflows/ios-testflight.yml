name: iOS TestFlight (cloud build)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ios-wrapper/**", ".github/workflows/ios-testflight.yml"]
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    defaults: { run: { working-directory: ios-wrapper } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3", bundler-cache: false }
      - run: gem install fastlane cocoapods --no-document
      - run: npm ci || npm install
      - run: npx cap sync ios
      - run: cd ios/App && pod install
      - name: Build + upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: fastlane ios beta
