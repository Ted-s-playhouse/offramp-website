<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1B4332">
<title>OffRamp REI — Deal Room</title>
<link rel="icon" href="/brand/mark_ramp.png">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="apple-touch-icon" href="/app/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OffRamp">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>
  /* ---- Revive/OffRamp brand palette (matches CRM theme.ts) ---- */
  :root{
    --bg:#F6F5F1; --card:#FFFFFF; --text:#15221B; --sub:#5C6B62; --border:#E3E1D9;
    --accent:#1B4332; --accent2:#2D6A4F; --accentSoft:#DDE9E1; --danger:#C0392B;
    --gold:#B8894A; --hot:#E4572E; --warm:#E9A620; --cold:#4A7BA6;
    --shadow:0 2px 6px rgba(11,31,22,.06),0 8px 24px rgba(11,31,22,.05);
    --maxw:520px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);background:#e9e7e0;-webkit-font-smoothing:antialiased}
  a{color:var(--accent2);text-decoration:none}
  button,input,select{font-family:inherit}
  button{cursor:pointer}
  .hidden{display:none!important}
  img{display:block}

  /* phone-frame shell centered on desktop, full-bleed on mobile */
  #shell{max-width:var(--maxw);margin:0 auto;min-height:100%;background:var(--bg);position:relative;
    box-shadow:0 0 60px rgba(0,0,0,.12);display:flex;flex-direction:column;min-height:100dvh}

  /* ---------- AUTH ---------- */
  #auth{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:22px;
    background:linear-gradient(160deg,var(--accent) 0%,var(--accent2) 60%,#173a2c 100%)}
  .authcard{background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.28);width:100%;max-width:400px;padding:28px}
  .brandrow{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .brandrow img{width:32px;height:32px}
  .brandrow b{font-size:20px;color:var(--accent);font-weight:900}
  .brandrow span{color:var(--accent2);font-weight:800;font-size:20px}
  .authcard p.sub{color:var(--sub);font-size:13.5px;margin:2px 0 18px}
  .tabs{display:flex;gap:6px;background:#f0efe9;border-radius:10px;padding:4px;margin-bottom:16px}
  .tabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:8px;font-weight:800;color:var(--sub);font-size:14px}
  .tabs button.on{background:#fff;color:var(--accent);box-shadow:var(--shadow)}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:11.5px;font-weight:700;color:var(--sub);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em}
  .field input{width:100%;padding:12px 13px;border:1px solid var(--border);border-radius:10px;font-size:15px;background:#fff}
  .field input:focus{outline:none;border-color:var(--accent2);box-shadow:0 0 0 3px rgba(45,106,79,.15)}
  .btn-primary{width:100%;border:0;padding:13px;border-radius:10px;font-size:15px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .or{display:flex;align-items:center;gap:12px;color:var(--sub);font-size:12px;margin:16px 0}
  .or:before,.or:after{content:"";flex:1;height:1px;background:var(--border)}
  .sso{display:flex;flex-direction:column;gap:9px}
  .sso button{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;border-radius:10px;
    border:1px solid var(--border);background:#fff;font-weight:700;font-size:14px;color:#25302a}
  .sso .apple{background:#000;color:#fff;border-color:#000}
  .sso svg{width:18px;height:18px}
  .authmsg{margin-top:12px;font-size:13.5px;padding:10px 12px;border-radius:9px;display:none}
  .authmsg.err{display:block;background:#fbeae6;color:var(--danger);border:1px solid #e6b6ab}
  .demohint{margin-top:16px;font-size:12px;color:var(--sub);text-align:center;line-height:1.5}
  .demohint code{background:#f0efe9;padding:1px 6px;border-radius:5px;color:var(--accent);font-weight:700}

  /* ---------- APP TOP BAR ---------- */
  header.top{background:var(--accent);color:#fff;display:flex;align-items:center;gap:10px;
    padding:0 15px;padding-top:env(safe-area-inset-top);height:calc(44px + env(safe-area-inset-top));position:relative;z-index:1}
  header.top .logo{display:flex;align-items:center;gap:7px;font-weight:900;font-size:16px}
  header.top .logo img{width:24px;height:24px}
  header.top .logo span{color:#b7e4c7}
  header.top .grow{flex:1}
  .plan-pill{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:4px 9px;border-radius:20px}
  .plan-pill.pro{background:var(--gold);color:#231a0c}
  .plan-pill.free{background:#e6e4dc;color:var(--sub)}
  .meterchip{font-size:12px;color:var(--sub);font-weight:600;white-space:nowrap}
  .meterchip b{color:var(--text)}

  /* ---------- SCREENS ---------- */
  main{flex:1;overflow:visible;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .screen{display:none}
  .screen.on{display:block}

  /* ---------- PINNED SEARCH TOOLBAR (A) ---------- */
  /* sticks to the viewport top once the brand bar scrolls away; the env() gradient paints the
     iOS status-bar band brand-green so white status text stays readable in standalone mode */
  .toolbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;padding:8px 12px;
    padding-top:calc(8px + env(safe-area-inset-top));border-bottom:1px solid var(--border);
    background:linear-gradient(to bottom,var(--accent) env(safe-area-inset-top),var(--bg) env(safe-area-inset-top))}
  .searchbox{display:flex;align-items:center;flex:1;min-width:0;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:0 10px;height:40px}
  .searchbox:focus-within{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(45,106,79,.15)}
  .searchbox svg{width:18px;height:18px;color:var(--sub);flex:none}
  .searchbox input{flex:1;min-width:0;border:0;outline:none;padding:0 6px;font-size:15px;background:transparent;color:var(--text)}
  .tchip{flex:none;max-width:124px;height:40px;padding:0 12px;border-radius:20px;border:1px solid var(--border);background:var(--card);
    font-size:13px;font-weight:800;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .tchip .car{font-size:10px;opacity:.7;margin-left:3px}
  .tbtn{flex:none;position:relative;display:flex;align-items:center;gap:5px;height:40px;padding:0 11px;border-radius:12px;border:1px solid var(--border);
    background:var(--card);color:var(--accent);font-size:13px;font-weight:800}
  .tbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2}
  .tbtn.on{border-color:var(--accent);background:var(--accentSoft)}
  .fbadge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--hot);color:#fff;
    font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
  .countrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 16px 8px}
  .metaline{display:flex;align-items:center;gap:7px;margin-left:auto}
  .countline{font-size:12px;color:var(--sub);font-weight:700}

  .empty b{display:block;margin-bottom:6px;color:var(--text)}.empty .chip em{font-style:normal;color:var(--sub);margin-left:4px}
  .chiprow{display:flex;gap:8px;overflow-x:auto;padding:8px 12px 4px;scrollbar-width:none}
  .chiprow::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);
    font-size:13px;font-weight:700;color:var(--text)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

  /* ---------- BOTTOM SHEET (B state picker, C filters) ---------- */
  #sheet{position:fixed;inset:0;z-index:66}
  .sheet-bg{position:absolute;inset:0;background:rgba(11,31,22,.45);opacity:0;transition:opacity .2s}
  .sheet{position:absolute;left:50%;bottom:0;width:100%;max-width:var(--maxw);transform:translate(-50%,100%);transition:transform .25s ease;
    background:var(--bg);border-radius:18px 18px 0 0;max-height:80vh;max-height:80dvh;display:flex;flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -8px 30px rgba(0,0,0,.18)}
  #sheet.open .sheet-bg{opacity:1}
  #sheet.open .sheet{transform:translate(-50%,0)}
  .sheet .grab{width:40px;height:4px;border-radius:2px;background:#cfcdc5;margin:10px auto 8px;flex:none}
  .sheethead{display:flex;align-items:center;justify-content:space-between;padding:0 16px 8px;flex:none}
  .sheethead b{font-size:17px;font-weight:900;color:var(--accent)}
  .sheetx{border:0;background:#ebe9e2;color:var(--sub);width:30px;height:30px;border-radius:50%;font-size:20px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center}
  .sheetbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px 16px}
  .sheetq{display:flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:0 10px;height:42px;margin:2px 0 4px}
  .sheetq svg{width:18px;height:18px;color:var(--sub);flex:none}
  .sheetq input{flex:1;min-width:0;border:0;outline:none;padding:0 6px;font-size:15px;background:transparent;color:var(--text)}
  .sgroup{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);padding:12px 4px 6px}
  .slist{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .srow{display:flex;align-items:center;gap:8px;width:100%;border:0;border-bottom:1px solid var(--border);background:transparent;padding:12px 12px;font-size:15px;color:var(--text);text-align:left}
  .srow:last-child{border-bottom:0}
  .srow:active{background:var(--accentSoft)}
  .srow .nm{flex:1;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .srow .cnt{color:var(--sub);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  .srow .chk{width:20px;text-align:right;color:var(--accent);font-weight:900;visibility:hidden}
  .srow.on .chk{visibility:visible}
  .srow.on .nm{color:var(--accent);font-weight:800}
  .snone{padding:22px;text-align:center;color:var(--sub);font-size:14px}
  .fblock{margin:4px 0 12px}
  .fblock label{display:block;font-size:11.5px;font-weight:700;color:var(--sub);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em}
  .fblock select{width:100%;padding:12px 10px;border:1px solid var(--border);border-radius:10px;font-size:15px;background:var(--card);color:var(--text)}
  .fbtns{display:flex;gap:8px;margin-top:4px}
  .fbtns .btn-ghost,.fbtns .btn-primary{margin:0;flex:1}
  body.sheet-open{overflow:hidden}

  /* lead card (mirrors CRM LeadCard) */
  .lead{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--sub);border-radius:14px;
    margin:0 12px 12px;padding:13px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s}
  .lead:active{transform:scale(.985)}
  .lead .top{display:flex;align-items:center;gap:12px}
  .thumb{width:88px;height:88px;border-radius:11px;overflow:hidden;background:var(--border);flex:none;position:relative}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb.noimg::after{content:"No photo";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:11px}
  .lead .mid{flex:1;min-width:0}
  .lead .owner{font-size:15.5px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lead .street{font-size:13px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lead .csz{font-size:12px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lead .right{text-align:right;flex:none}
  .lead .right .eq{font-size:17px;font-weight:800;color:var(--text)}
  .lead .right .eqk{font-size:11px;color:var(--sub)}
  .lead .right .val{font-size:12px;color:var(--sub);margin-top:4px}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .badge{font-size:10.5px;font-weight:800;letter-spacing:.02em;padding:3px 9px;border-radius:20px;border:1px solid transparent}
  .badge.status{color:#fff}
  .badge.soon{background:var(--danger);color:#fff}
  .badge.auc{background:var(--warm);color:#3a2a06}
  .badge.outline{background:transparent;border-color:var(--border);color:var(--sub)}

  .empty{padding:48px 24px;text-align:center;color:var(--sub);font-size:14px}
  .loadrow{padding:26px;text-align:center;color:var(--sub)}

  /* map screen */
  #mapScreen{height:calc(100dvh - 44px - env(safe-area-inset-top) - 57px - env(safe-area-inset-bottom))}
  #map{width:100%;height:100%}

  /* lookup + account cards */
  .pad{padding:14px}
  .h2{font-size:19px;font-weight:900;color:var(--accent);margin:4px 2px 12px}
  .lookupbox{display:flex;gap:8px;margin-bottom:12px}
  .lookupbox input{flex:1;padding:12px;border:1px solid var(--border);border-radius:11px;font-size:15px;background:var(--card)}
  .infocard{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  .infocard .hero{width:100%;height:180px;object-fit:cover;background:var(--border)}
  .infocard .inner{padding:14px}
  .rowline{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:14px}
  .rowline:last-child{border-bottom:0}
  .rowline .k{color:var(--sub)}
  .rowline .v{font-weight:700;text-align:right}

  .acct-plan{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .acct-plan .big{font-size:22px;font-weight:900;color:var(--accent)}
  .meter{margin:10px 0}
  .meter .lab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);margin-bottom:5px}
  .meter .bar{height:9px;border-radius:6px;background:var(--border);overflow:hidden}
  .meter .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .btn-ghost{width:100%;background:var(--card);border:1px solid var(--border);color:var(--accent);padding:13px;border-radius:11px;font-weight:800;font-size:14.5px;margin-top:10px}
  .btn-gold{width:100%;background:var(--gold);border:0;color:#231a0c;padding:13px;border-radius:11px;font-weight:800;font-size:14.5px;margin-top:10px}

  /* ---------- BOTTOM NAV ---------- */
  nav.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--maxw);
    background:var(--card);border-top:1px solid var(--border);display:flex;z-index:50;
    padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  nav.bottom button{flex:1;background:transparent;border:0;padding:8px 0 2px;display:flex;flex-direction:column;
    align-items:center;gap:3px;color:var(--sub);font-size:11px;font-weight:700}
  nav.bottom button svg{width:23px;height:23px;stroke:var(--sub);fill:none;stroke-width:2}
  nav.bottom button.on{color:var(--accent)}
  nav.bottom button.on svg{stroke:var(--accent)}

  /* ---------- DETAIL (full-screen slide-over) ---------- */
  #detail{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);
    width:100%;max-width:var(--maxw);background:var(--bg);z-index:70;overflow-y:auto;transition:transform .25s ease;-webkit-overflow-scrolling:touch}
  #detail.open{transform:translateX(-50%) translateY(0)}
  .dhero{width:100%;height:210px;object-fit:cover;background:var(--border)}
  .dhead{background:var(--accent);color:#fff;padding:14px 16px 16px}
  .dback{display:inline-flex;align-items:center;gap:4px;background:transparent;border:0;color:#cfe6d8;font-weight:800;font-size:14.5px;margin-bottom:8px}
  .dhead .owner{font-size:23px;font-weight:900;line-height:1.2}
  .dhead .street{font-size:15px;font-weight:600;margin-top:3px}
  .dhead .csz{font-size:12.5px;opacity:.82;margin-top:1px}
  .dhead .badges{margin-top:11px}
  .dhead .badge.hbadge{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.24)}
  .dkv{display:flex;flex-wrap:wrap;margin-top:8px}
  .dkv .cell{width:50%;padding:6px 8px 0 0}
  .dkv .cell .k{font-size:11px;opacity:.75}
  .dkv .cell .v{font-size:16px;font-weight:700}
  .dbody{padding:14px 14px 60px}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 12px}
  .kpi.big{grid-column:span 2}
  .kpi .k{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.03em}
  .kpi .v{font-size:18px;font-weight:900;color:var(--accent);margin-top:2px}
  .sec{margin:20px 2px 8px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--sub)}
  .card2{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:6px 12px}
  .card2 .rowline{font-size:14px}
  .flagstrip{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
  .flag{font-size:11px;font-weight:800;letter-spacing:.02em;padding:4px 10px;border-radius:20px;border:1px solid transparent}
  .flag.probate{background:#efe7f7;color:#5b3a86;border-color:#d9c8ee}
  .flag.bk{background:#fbeae6;color:var(--danger);border-color:#e6b6ab}
  .flag.mls{background:#e7f0fb;color:#2b5f92;border-color:#c2d8ef}
  .flag.rev{background:#fff4e0;color:#8a5a12;border-color:#f0d9a8}
  .flag.abs{background:var(--accentSoft);color:var(--accent2);border-color:rgba(45,106,79,.25)}
  .maplinks{display:flex;gap:9px;margin-top:12px}
  .maplinks a{flex:1;text-align:center;background:var(--accentSoft);border:1px solid rgba(27,67,50,.25);color:var(--accent);font-weight:800;font-size:13.5px;padding:10px;border-radius:11px}

  .analyzer{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
  .analyzer .ins{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .analyzer label{font-size:11px;color:var(--sub);font-weight:700;text-transform:uppercase}
  .analyzer input{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-top:3px;background:var(--bg)}
  .analyzer .out{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .analyzer .out .box{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:9px 11px}
  .analyzer .out .box .k{font-size:10.5px;color:var(--sub);text-transform:uppercase}
  .analyzer .out .box .v{font-size:16px;font-weight:900;color:var(--accent)}
  .verdict{margin-top:11px;padding:10px 12px;border-radius:9px;font-weight:800;font-size:13.5px;text-align:center}
  .verdict.good{background:#e7f4ec;color:var(--accent2)}
  .verdict.bad{background:#fbeae6;color:var(--danger)}
  .verdict.neutral{background:var(--bg);color:var(--sub)}

  .plangrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
  .plancard{border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--card)}
  .plancard.cur{border-color:#1B4332}
  .plancard .pn{font-weight:800;font-size:15px}.plancard .pp{float:right;color:#1B4332}.plancard .pp small{font-weight:500;color:var(--sub)}
  .plancard .pb{font-size:12px;color:var(--sub);margin:6px 0 10px;line-height:1.4}.plancard .pcur{font-size:12px;font-weight:700;color:#1B4332}
  .plancard .btn-gold{width:100%;margin:0}
  .locked-row{cursor:pointer}
  .locked-row .v{display:flex;align-items:center;gap:8px;justify-content:flex-end}
  .locked-row .blur{filter:blur(5px);user-select:none;color:var(--sub)}
  .locked-row .lock{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;background:var(--gold);color:#231a0c;padding:3px 7px;border-radius:12px}
  .contactcard{padding:0 12px}.empty-v{color:var(--sub);font-style:italic}

<!-- ============ DETAIL ============ -->

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"

<script>
var ME=null, MAP=null, MARKERS=null, ROWS=[], CUR=null, SCREEN='deals';
var ACTIONS={}; var SHOW_HIDDEN=false;
var STATE=null; var COUNTS={hit:{},national:{},total:{}};
var ADJ={AL:['FL','GA','MS','TN'],AK:['WA','OR','HI'],AZ:['CA','CO','NV','NM','UT'],AR:['LA','MS','MO','OK','TN','TX'],CA:['AZ','NV','OR'],CO:['AZ','KS','NE','NM','OK','UT','WY'],CT:['MA','NY','RI'],DE:['MD','NJ','PA'],DC:['MD','VA'],FL:['AL','GA'],GA:['AL','FL','NC','SC','TN'],HI:['CA','AK'],ID:['MT','NV','OR','UT','WA','WY'],IL:['IN','IA','KY','MI','MO','WI'],IN:['IL','KY','MI','OH'],IA:['IL','MN','MO','NE','SD','WI'],KS:['CO','MO','NE','OK'],KY:['IL','IN','MO','OH','TN','VA','WV'],LA:['AR','MS','TX'],ME:['NH'],MD:['DE','DC','PA','VA','WV'],MA:['CT','NH','NY','RI','VT'],MI:['IN','OH','WI'],MN:['IA','ND','SD','WI'],MS:['AL','AR','LA','TN'],MO:['AR','IL','IA','KS','KY','NE','OK','TN'],MT:['ID','ND','SD','WY'],NE:['CO','IA','KS','MO','SD','WY'],NV:['AZ','CA','ID','OR','UT'],NH:['ME','MA','VT'],NJ:['DE','NY','PA'],NM:['AZ','CO','OK','TX','UT'],NY:['CT','MA','NJ','PA','VT'],NC:['GA','SC','TN','VA'],ND:['MN','MT','SD'],OH:['IN','KY','MI','PA','WV'],OK:['AR','CO','KS','MO','NM','TX'],OR:['CA','ID','NV','WA'],PA:['DE','MD','NJ','NY','OH','WV'],RI:['CT','MA'],SC:['GA','NC'],SD:['IA','MN','MT','NE','ND','WY'],TN:['AL','AR','GA','KY','MS','MO','NC','VA'],TX:['AR','LA','NM','OK'],UT:['AZ','CO','ID','NV','NM','WY'],VT:['MA','NH','NY'],VA:['DC','KY','MD','NC','TN','WV'],WA:['ID','OR','AK'],WV:['KY','MD','OH','PA','VA'],WI:['IL','IA','MI','MN'],WY:['CO','ID','MT','NE','SD','UT']};
function emptyStateHtml(){
  var filtered=document.getElementById('fStatus').value||document.getElementById('fEquity').value||document.getElementById('fSearch').value.trim();
  var name=STATE?(STATE_NAMES[STATE]||STATE):'any state';
  var tot=COUNTS.total||{};
  var nearby=(STATE?(ADJ[STATE]||[]):[]).filter(function(k){return tot[k]>0;}).sort(function(a,b){return tot[b]-tot[a];});
  if(!nearby.length){ nearby=Object.keys(tot).filter(function(k){return k!==STATE&&tot[k]>0;}).sort(function(a,b){return tot[b]-tot[a];}).slice(0,6); }
  var links=nearby.map(function(k){return '<a class="chip" href="#" onclick="pickState(\''+k+'\');return false;">'+(STATE_NAMES[k]||k)+' <em>'+tot[k]+'</em></a>';}).join('');
  var head=filtered?('No deals match that search in '+name+' right now.'):('No auctions in '+name+' right now.');
  var clear=filtered?'<div style="margin:8px 0"><a href="#" onclick="clearFilters();return false;">Clear the search and filters</a></div>':'';
  return '<div class="empty"><b>'+head+'</b>'+clear+(links?'<div style="margin-top:10px;color:var(--sub);font-size:13px">See nearby states</div><div class="chiprow" style="flex-wrap:wrap;justify-content:center;padding:8px 0">'+links+'</div>':'')+'</div>';
}
function clearFilters(){ document.getElementById('fStatus').value=''; document.getElementById('fEquity').value=''; document.getElementById('fSearch').value=''; search(); }
var STATE_NAMES={AL:'Alabama',AK:'Alaska',AZ:'Arizona',AR:'Arkansas',CA:'California',CO:'Colorado',CT:'Connecticut',DE:'Delaware',DC:'District of Columbia',FL:'Florida',GA:'Georgia',HI:'Hawaii',ID:'Idaho',IL:'Illinois',IN:'Indiana',IA:'Iowa',KS:'Kansas',KY:'Kentucky',LA:'Louisiana',ME:'Maine',MD:'Maryland',MA:'Massachusetts',MI:'Michigan',MN:'Minnesota',MS:'Mississippi',MO:'Missouri',MT:'Montana',NE:'Nebraska',NV:'Nevada',NH:'New Hampshire',NJ:'New Jersey',NM:'New Mexico',NY:'New York',NC:'North Carolina',ND:'North Dakota',OH:'Ohio',OK:'Oklahoma',OR:'Oregon',PA:'Pennsylvania',RI:'Rhode Island',SC:'South Carolina',SD:'South Dakota',TN:'Tennessee',TX:'Texas',UT:'Utah',VT:'Vermont',VA:'Virginia',WA:'Washington',WV:'West Virginia',WI:'Wisconsin',WY:'Wyoming'};

function money(n){ if(n===null||n===undefined||n==='')return '—'; var x=Number(n); if(isNaN(x))return '—'; return '$'+Math.round(x).toLocaleString(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; setTimeout(function(){t.style.display='none';},2600); }
function api(path,opts){ opts=opts||{}; opts.credentials='include'; if(opts.body&&typeof opts.body!=='string'){opts.headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});opts.body=JSON.stringify(opts.body);} return fetch(path,opts); }
function fullAddr(r){ return [r.property_street,r.property_city,r.property_state,r.property_zip].filter(Boolean).join(', '); }
  function photoUrl(r){
    if(r.photo_url) return r.photo_url;
    var a=fullAddr(r);
    if(!a) return '';
    return '/api/photo?id='+encodeURIComponent(r.id||'')+'&address='+encodeURIComponent(a);
  }
  function photoFallback(r){
    var a=fullAddr(r);
    if(!a) return '';
    return '/api/photo?id='+encodeURIComponent(r.id||'')+'&address='+encodeURIComponent(a);
  }
function tempColor(t){ t=(t||'').toLowerCase(); return t==='hot'?'#E4572E':t==='warm'?'#E9A620':t==='cold'?'#4A7BA6':'#5C6B62'; }

/* ---------- auth ---------- */
function setTab(t){
  var login=t==='login';
  document.getElementById('tabLogin').classList.toggle('on',login);
  document.getElementById('tabSignup').classList.toggle('on',!login);
  document.getElementById('nameField').style.display=login?'none':'block';
  document.getElementById('authSubmit').textContent=login?'Log in':'Create account';
  document.getElementById('f_pw').autocomplete=login?'current-password':'new-password';
  document.getElementById('authForm').dataset.mode=t;
}
function authErr(m){ var e=document.getElementById('authMsg'); e.textContent=m; e.className='authmsg err'; }
function doAuth(ev){
  ev.preventDefault();
  var mode=document.getElementById('authForm').dataset.mode||'login';
  var body={email:document.getElementById('f_email').value.trim(),password:document.getElementById('f_pw').value};
  if(mode==='signup') body.full_name=document.getElementById('f_name').value.trim();
  api('/api/auth/'+mode,{method:'POST',body:body}).then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j};});})
   .then(function(res){ if(!res.ok){authErr(res.j.error||'Something went wrong');return;} ME=res.j.user; enterApp(); })
   .catch(function(){authErr('Network error');});
  return false;
}
function ssoLogin(p){ window.location.href='/api/auth/sso?provider='+p; }
function doLogout(){ api('/api/auth/logout',{method:'POST'}).then(function(){location.reload();}); }
function doUpgrade(plan){
  fetch('/api/billing/checkout-link',{method:'POST',credentials:'include',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({plan:plan||'pro'})})
    .then(function(r){return r.json();})
    .then(function(d){ if(d.url) location.href=d.url; else toast(d.error||'billing unavailable'); })
    .catch(function(){ toast('billing unavailable'); });
}

/* ---------- boot ---------- */

  document.getElementById('auth').classList.add('hidden');
  document.getElementById('shell').classList.remove('hidden');

  // search is the entry point; states are a secondary browse. Default = all states (national).
  try{ STATE=localStorage.getItem('offramp_state')||null; }catch(e){}
  if(STATE&&!STATE_NAMES[STATE])STATE=null;
  renderStateBrowse();
  api('/api/state-counts').then(function(r){return r.json();}).then(function(j){ COUNTS=j||COUNTS; renderStateBrowse(); }).catch(function(){});
  loadActions().then(search);
  renderAccount();
  if(window.PENDING_CHECKOUT&&!isNativeApp()){ var pc=window.PENDING_CHECKOUT; window.PENDING_CHECKOUT=null; showScreen('acct'); doUpgrade(pc); }
}
function loadActions(){
  return api('/api/lead-actions').then(function(r){return r.json();}).then(function(j){ACTIONS=j.actions||{};}).catch(function(){ACTIONS={};});
}
function renderHeader(){
  var pill=document.getElementById('planPill');
  pill.textContent=planLabel();
  pill.className='plan-pill '+(ME.paid?'pro':'free');
  var u=ME.usage;
  var left=Math.max(0,(u.lookups.limit||0)-(u.lookups.used||0));
  document.getElementById('meterChip').innerHTML=(u.lookups.limit?('<b>'+left+'</b> credits left'):planLabel())+(u.overage_credits?' <span style="color:#b26a00">· '+u.overage_credits+' overage</span>':'');
}
function pickState(m){ STATE=m||null;
  try{ if(STATE)localStorage.setItem('offramp_state',STATE); else localStorage.removeItem('offramp_state'); }catch(e){}
  renderStateBrowse(); search();
}
/* A/B: the toolbar state chip reflects STATE; the full picker lives in the bottom sheet */
function renderStateBrowse(){
  var b=document.getElementById('stateChipBtn');
  var n=STATE?((COUNTS.total||{})[STATE]||0):0;
  b.innerHTML=esc(STATE?(STATE+(n?' · '+n:'')):'All states')+'<span class="car">▾</span>';

}
// quick-tap shortcuts: the enriched markets first, then the busiest national states (same rule as the old chip row)
function quickStates(){
  var quick=(ME&&ME.markets?ME.markets:[]).slice();
  Object.keys(COUNTS.total||{}).sort(function(a,b){return (COUNTS.total[b]||0)-(COUNTS.total[a]||0);}).forEach(function(k){ if(quick.length<9&&quick.indexOf(k)<0)quick.push(k); });
  return quick;
}

/* ---------- bottom sheet (shared by the state picker and the filter panel) ---------- */
var SHEET=null, FILTER_SNAP=null, SHEET_TIMER=null;
function openSheet(which,title){
  var w=document.getElementById('sheet');
  if(SHEET_TIMER){clearTimeout(SHEET_TIMER);SHEET_TIMER=null;}
  SHEET=which;
  document.getElementById('sheetTitle').textContent=title;
  document.getElementById('sheetState').classList.toggle('hidden',which!=='state');
  document.getElementById('sheetFilter').classList.toggle('hidden',which!=='filter');
  w.classList.remove('hidden'); document.body.classList.add('sheet-open');
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ w.classList.add('open'); }); });
}
function closeSheet(){
  var w=document.getElementById('sheet');
  if(SHEET==='filter'&&FILTER_SNAP){ // dismissed without Apply: put the selects back to what the list is showing
    document.getElementById('fStatus').value=FILTER_SNAP[0]; document.getElementById('fEquity').value=FILTER_SNAP[1]; FILTER_SNAP=null;
  }
  SHEET=null; w.classList.remove('open'); document.body.classList.remove('sheet-open');
  SHEET_TIMER=setTimeout(function(){ w.classList.add('hidden'); SHEET_TIMER=null; },260);
}
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&SHEET)closeSheet(); });
// swipe-down on the grab handle / header closes the sheet
(function(){ var y0=null; var sh=document.getElementById('sheet');
  sh.addEventListener('touchstart',function(e){ var t=e.target; y0=(t.closest&&(t.closest('.grab')||t.closest('.sheethead')))?e.touches[0].clientY:null; },{passive:true});
  sh.addEventListener('touchend',function(e){ if(y0!==null&&e.changedTouches[0].clientY-y0>60)closeSheet(); y0=null; },{passive:true});
})();

/* B: state picker sheet */
function openStateSheet(){ document.getElementById('stateQ').value=''; renderStateList(); openSheet('state','Browse by state'); }
function stateRow(k,n){

    '<span class="cnt">'+(n?n:'')+'</span><span class="chk">✓</span></button>';
}
function renderStateList(){
  var q=(document.getElementById('stateQ').value||'').trim().toLowerCase();
  var tot=COUNTS.total||{};
  var total=Object.keys(tot).reduce(function(a,k){return a+(tot[k]||0);},0);

/* ---------- search ---------- */
function stateFromText(t){
  var u=(t||'').trim().toUpperCase(); if(!u)return null;
  if(STATE_NAMES[u])return u;
  for(var k in STATE_NAMES){ if(STATE_NAMES[k].toUpperCase()===u)return k; }
  return null;
}
function search(){
  updateFilterBadge();
  var c=document.getElementById('fSearch').value.trim();
  var typedState=stateFromText(c);
  if(typedState){ STATE=typedState; c=''; document.getElementById('fSearch').value=''; try{localStorage.setItem('offramp_state',STATE);}catch(e){} renderStateBrowse(); }
  var qs=new URLSearchParams();
  if(STATE)qs.set('state',STATE);
  if(c)qs.set('q',c);
  var s=document.getElementById('fStatus').value; if(s)qs.set('status',s);
  var e=document.getElementById('fEquity').value; if(e)qs.set('min_equity',e);
  qs.set('limit','200');
  var nq=new URLSearchParams(); if(STATE)nq.set('state',STATE); if(c)nq.set('q',c); nq.set('limit',STATE?'300':'150');
  document.getElementById('list').innerHTML='<div class="loadrow">Searching…</div>';
  var seq=(window.SEARCH_SEQ=(window.SEARCH_SEQ||0)+1);
  Promise.all([
    api('/api/search?'+qs.toString()).then(function(r){return r.json();}).catch(function(){return {results:[]};}),
    (s||e)?Promise.resolve({results:[]}):api('/api/national-search?'+nq.toString()).then(function(r){return r.json();}).catch(function(){return {results:[]};})
  ]).then(function(res){
    if(seq!==window.SEARCH_SEQ)return;
    var enriched=res[0].results||[], national=res[1].results||[];
    var seen={}; enriched.forEach(function(r){ seen[((r.property_street||'')+'|'+(r.property_zip||'')).toUpperCase()]=1; });
    var extra=national.filter(function(r){ var k=((r.property_street||'')+'|'+(r.property_zip||'')).toUpperCase(); if(seen[k])return false; seen[k]=1; return true; });
    ROWS=enriched.concat(extra); renderList(); if(MAP)renderPins();
    var where=STATE?(STATE_NAMES[STATE]||STATE):'all states';
    document.getElementById('countLine').textContent=ROWS.length?(ROWS.length+' deals in '+where+(enriched.length&&extra.length?' · '+enriched.length+' with owner data':'')):'';
  });
}

  if(!mob.length)mob=phones||[];
  var h=mob.map(function(p){var n=String(p.number||'').replace(/\D/g,'');var f=n.length===10?'('+n.slice(0,3)+') '+n.slice(3,6)+'-'+n.slice(6):n;
    return '<div class="phone"><a class="num" href="tel:'+n+'">'+f+'</a><span class="tag'+(p.dnc?' dnc':'')+'">'+(p.dnc?'DNC':esc(p.type||'mobile'))+'</span></div>';}).join('');
  if(emails&&emails.length){ h+='<div style="margin-top:10px">'+emails.map(function(e){var em=(typeof e==='string')?e:(e.email||'');return '<span class="emailchip">'+esc(em)+'</span>';}).join('')+'</div>'; }
  return h;
}
function reveal(){
  var el=document.getElementById('contacts'); el.innerHTML='<div class="locked">Skip-tracing…</div>';
  api('/api/skiptrace',{method:'POST',body:{id:CUR.id}}).then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j};});})
   .then(function(res){
     if(!res.ok){ el.innerHTML='<div class="locked"><b>'+esc(res.j.error||'Skip-trace failed')+'</b></div>'; return; }
     CUR.phones=res.j.mobiles; CUR.emails=res.j.emails;
     el.innerHTML=(res.j.mobiles&&res.j.mobiles.length)?(callButton(res.j.mobiles)+phoneHtml(res.j.mobiles,res.j.emails)):'<div class="locked">No mobile numbers found for this owner.</div>';
     if(res.j.usage){ME.usage=res.j.usage;renderHeader();}
   }).catch(function(){el.innerHTML='<div class="locked">Network error</div>';});
}

/* ---------- analyzer (no MAO) ---------- */
var ANALYZE_TIMER=null, ANALYZE_CTL=null;
function runAnalyze(){
  if(ANALYZE_TIMER) clearTimeout(ANALYZE_TIMER);
  if(ANALYZE_CTL){ ANALYZE_CTL.abort(); ANALYZE_CTL=null; }
  var v=document.getElementById('o_verdict');
  if(v){ v.textContent='Calculating'; v.className='verdict neutral'; }
  ANALYZE_TIMER=setTimeout(sendAnalyze, 500);
}
function sendAnalyze(){
  ANALYZE_TIMER=null;
  if(!document.getElementById('an_arv'))return;
  if(ANALYZE_CTL) ANALYZE_CTL.abort();
  ANALYZE_CTL=new AbortController();
  var seq=ANALYZE_CTL;
  var b={arv:val('an_arv'),rehab:val('an_rehab'),offer:val('an_offer'),mortgage_balance:val('an_mb'),market_value:CUR.market_value};
  api('/api/analyze',{method:'POST',body:b,signal:seq.signal}).then(function(r){return r.json();}).then(function(j){
    if(seq!==ANALYZE_CTL) return;
    var a=j.analysis;
    var profit=document.getElementById('o_profit');
    var roi=document.getElementById('o_roi');
    var v=document.getElementById('o_verdict');
    if(!profit||!roi||!v) return;
    profit.textContent=a.est_profit!==null?money(a.est_profit):'—';
    roi.textContent=a.roi_pct!==null?a.roi_pct+'%':'—';
    v.textContent=a.verdict;
    v.className='verdict '+(a.est_profit===null?'neutral':(a.est_profit>0?'good':'bad'));
  }).catch(function(err){
    if(err&&err.name==='AbortError') return;
  });
}
function val(id){var e=document.getElementById(id);return e?e.value:'';}

/* ---------- address lookup ---------- */
function runLookup(){
  var a=document.getElementById('lookupAddr').value.trim(); if(!a)return;
  var out=document.getElementById('lookupOut'); out.innerHTML='<div class="loadrow">Looking up…</div>';
  api('/api/lookup',{method:'POST',body:{address:a}}).then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j};});})
   .then(function(res){
     if(!res.ok){ out.innerHTML='<div class="verdict bad">'+esc(res.j.error||'Lookup failed')+'</div>'; return; }
     var d=res.j.data||{}; var p=d.data||d;
     var pi=p.propertyInfo||{}; var addr=(pi.address&&(pi.address.label||pi.address.formattedAddress))||a;
     var val=(p.estimatedValue||p.avm||pi.marketValue);
     var pu='/api/photo?address='+encodeURIComponent(a);
     out.innerHTML='<div class="infocard"><img class="hero" src="'+pu+'" alt="" onerror="this.style.display=\'none\'"><div class="inner">'+
       line('Address',addr)+
       line('Owner',(p.ownerInfo&&(p.ownerInfo.owner1FullName||p.ownerInfo.owner1LastName))||'—')+
       line('Est. value',money(val))+
       line('Est. equity',money(p.equity))+
       line('Beds / Baths',((pi.bedrooms)||'—')+' / '+((pi.bathrooms)||'—'))+
       '<div style="font-size:11.5px;color:var(--sub);margin-top:8px">Source: '+esc(res.j.source)+' · counts toward your monthly lookups</div>'+
       '</div></div>';
     if(res.j.usage){ME.usage=res.j.usage;renderHeader();}
   }).catch(function(){out.innerHTML='<div class="verdict bad">Network error</div>';});
}

/* ---------- account ---------- */
function planLabel(){ if(ME.plan==='premium')return 'Premium'; if(ME.plan==='pro')return ME.founding?'Pro · Founding':'Pro'; return 'Free'; }
function isNativeApp(){ try{ return !!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()); }catch(e){ return false; } }
function planCard(key,name,price,blurb,cur){
  return '<div class="plancard'+(cur?' cur':'')+'"><div class="pn">'+name+' <span class="pp">$'+price+'<small>/mo</small></span></div><div class="pb">'+blurb+'</div>'+
    (cur?'<div class="pcur">Your plan</div>':(isNativeApp()
      ? '<a class="btn-gold" style="display:block;text-align:center;text-decoration:none" href="https://offramprei.com/app/?checkout='+key+'" target="_blank" rel="noopener">'+(ME.paid?'Switch to ':'Upgrade to ')+name+' on the web</a>'
      : '<button class="btn-gold" onclick="doUpgrade(\''+key+'\')">'+(ME.paid?'Switch to ':'Upgrade to ')+name+'</button>'))+'</div>';
}
function renderAccount(){
  var u=ME.usage;
  function meter(label,used,limit){
    var pctv=limit?Math.min(100,Math.round(used/limit*100)):0;
    return '<div class="meter"><div class="lab"><span>'+label+'</span><span>'+used+' / '+limit+'</span></div>'+
      '<div class="bar"><div class="fill" style="width:'+pctv+'%"></div></div></div>';
  }
  var isPaid=!!ME.paid, isPrem=ME.plan==='premium';
  var html='<div class="acct-plan"><span class="big">'+(ME.full_name||ME.email)+'</span>'+
      '<span class="plan-pill '+(isPaid?'pro':'free')+'">'+planLabel()+'</span></div>'+
    '<div style="color:var(--sub);font-size:13px;margin-bottom:14px">'+esc(ME.email)+'</div>'+
    '<div class="infocard"><div class="inner">'+
      meter('Credits this month',u.lookups.used,u.lookups.limit)+
      (ME.founding?meter('Skip-traces',u.skiptraces.used,u.skiptraces.limit):'')+
      (ME.overage_cents?'<div style="font-size:12px;color:var(--sub);margin-top:6px">Past '+u.lookups.limit+' credits each extra credit is $0.'+ME.overage_cents+' on your next invoice'+(u.overage_credits?' · '+u.overage_credits+' overage credits so far':'')+'.</div>':'')+
      (!isPaid?'<div style="font-size:12px;color:var(--sub);margin-top:6px">Free includes '+u.lookups.limit+' property lookups a month.</div>':'')+
    '</div></div>';
  if(ME.founding){ html+='<div class="infocard"><div class="inner" style="font-size:13px">🏅 Founding member. Your founding price and allowance are locked for your term.</div></div>'; }
  html+='<div class="plangrid">'+
    planCard('pro','Pro',ME.prices.pro,'200 credits a month. Owner phones &amp; emails, skip-trace, CSV export. Overage $0.35 a credit.',ME.plan==='pro')+
    planCard('premium','Premium',ME.prices.premium,'Everything in Pro plus next-of-kin and PACER bankruptcy tracking on every lead.',isPrem)+
  '</div>';
  html+='<div style="color:var(--sub);font-size:12.5px;margin:14px 2px 4px">Markets with live inventory</div>'+
    '<div class="chiprow" style="padding-left:0">'+ME.markets.map(function(m){return '<span class="chip">'+m+'</span>';}).join('')+'</div>';
  if(isPaid){ html+='<button class="btn-ghost" onclick="doExport()">⬇ Export current search (CSV)</button>'; }
  html+='<button class="btn-ghost" id="installBtn" style="display:'+(window.deferredInstall?'block':'none')+'" onclick="installApp()">⬇ Install OffRamp on this device</button>';
  if(/iPhone|iPad/.test(navigator.userAgent)&&!window.navigator.standalone){ html+='<div style="font-size:12px;color:var(--sub);margin:4px 2px 10px">On iPhone: tap Share, then <b>Add to Home Screen</b> to install OffRamp.</div>'; }
  html+='<button class="btn-ghost" onclick="doLogout()">Log out</button>';
  document.getElementById('acctBody').innerHTML=html;
}
function doExport(){
  if(!ME.paid){ toast('CSV export is a Pro feature'); return; }
  var qs=new URLSearchParams(); qs.set('state',STATE);
  var c=document.getElementById('fSearch').value.trim(); if(c)qs.set('q',c);
  var s=document.getElementById('fStatus').value; if(s)qs.set('status',s);
  var e=document.getElementById('fEquity').value; if(e)qs.set('min_equity',e);
  window.location.href='/api/export?'+qs.toString();
  toast('Exporting CSV…');
}

/* ---------- boot ---------- */
api('/api/me').then(function(r){ if(r.ok)return r.json(); throw 0; })
 .then(function(j){ ME=j.user; enterApp(); })
 .catch(function(){
   if(/[?&]signup=1\b/.test(window.location.search)) setTab('signup');
   var co=(window.location.search.match(/[?&]checkout=(pro|premium)\b/)||[])[1]; if(co){ window.PENDING_CHECKOUT=co; }
 });
</script>
<script>
/* item 16: installable PWA. Registers the service worker and offers an Install button when the browser allows it. */
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('/app/sw.js',{scope:'/app/'}).catch(function(){}); }); }
var deferredInstall=null;
window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); deferredInstall=e; var b=document.getElementById('installBtn'); if(b)b.style.display='block'; });
function installApp(){ if(!deferredInstall)return; deferredInstall.prompt(); deferredInstall.userChoice.then(function(){ deferredInstall=null; var b=document.getElementById('installBtn'); if(b)b.style.display='none'; }); }
</script>
